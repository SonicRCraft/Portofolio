services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: roland-portfolio
    restart: unless-stopped
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
