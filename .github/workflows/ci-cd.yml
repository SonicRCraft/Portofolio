name: CI/CD Pipeline & Server Deployment

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ===================================================
  # JOB 1: Test & Validate Node.js Build
  # ===================================================
  build-and-test:
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend bundle
        run: npm run build

  # ===================================================
  # JOB 2: Build & Push Docker Image to GHCR
  # ===================================================
  docker-build-and-push:
    name: Build & Push Docker Image
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===================================================
  # JOB 3: Automated Server Deployment via SSH
  # ===================================================
  deploy-to-server:
    name: Deploy to Server
    needs: docker-build-and-push
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'

    steps:
      - name: Connect to Twingate Zero Trust Network
        uses: twingate/github-action@v1
        with:
          service-key: ${{ secrets.TWINGATE_SERVICE_KEY }}

      - name: Deploy to Remote Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_SSH_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
    
            echo "=== [1/5] Setting up deployment directory ==="
            APP_DIR="${{ secrets.SERVER_APP_DIR || '~/portfolio' }}"
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"
    
            echo "=== [2/5] Authenticating with GitHub Container Registry ==="
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
    
            echo "=== [3/5] Generating Environment Variables & Config ==="
            REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            
            # Buat file .env
            echo "IMAGE=ghcr.io/${REPO_LOWER}:latest" > .env
            echo "PORT_MAP=${{ secrets.SERVER_PORT_MAPPING || '2000:2000' }}" >> .env
    
            # Buat file docker-compose.yml otomatis di server
            cat << 'EOF' > docker-compose.yml
            services:
              portfolio:
                image: ${IMAGE}
                container_name: roland-portfolio
                restart: unless-stopped
                ports:
                  - "${PORT_MAP:-2000:2000}"
                healthcheck:
                  test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:2000/health || exit 1"]
                  interval: 30s
                  timeout: 5s
                  retries: 3
            EOF
    
            echo "=== [4/5] Deploying updated container with Docker Compose ==="
            docker compose pull
            docker compose up -d
    
            echo "=== [5/5] Cleaning up old unused images ==="
            docker image prune -f
    
            echo "=== Deployment Completed Successfully! ==="
            docker compose ps
